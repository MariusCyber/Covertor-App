<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 style="text-align: center">Covertor in baza 2 si reverso</h1>
    <div style="display: flex; justify-content: center">
      <div
        id="centerDiv"
        style="
          background-color: rgb(244, 238, 238);
          height: 550px;
          width: 30%;
          padding: 15px;
          border-radius: 2%;
        "
      >
        <div id="selectDiv" style="display: flex; justify-content: space-between">
          <div  style="display: flex; flex-direction: column">
            <label for="din"><b>din</b></label>
            <select
              name="din"
              id="din"
              style="
                font-size: 16px;
                border: none;
                border-radius: 6px;
                padding: 10px;
                cursor: pointer;
              "
            >
              <option id="zecimal" value="zecimal">Zecimal</option>
              <option value="binar">Binar</option>
              <option value="octal">Octal</option>
              <option value="hexazecimal">Hexazecimal</option>
              <option value="text">Text</option>
            </select>
          </div>

          <div style="display: flex; flex-direction: column">
            <label for="in"><b>in</b></label>
            <select
              name="in"
              id="in"
              style="
                font-size: 16px;
                border: none;
                border-radius: 6px;
                padding: 10px;
                cursor: pointer;
              "
            >
              <option value="binar">Binar</option>
              <option value="zecimal">Zecimal</option>
              <option value="octal">Octal</option>
              <option value="hexazecimal">Hexazecimal</option>
              <option value="text">Text</option>
            </select>
          </div>
        </div>
        <div>
          <div>Introduceti o valoare <span id="conversion">zecimala</span></div>
        </div>
        <div style="display: flex; flex-direction: column">
          <div style="display: flex; flex-direction: row">
            <textarea
              type="text"
              id="inputText"
              style="
                height: 60px;
                width: 100%;
                resize: none;
                border: 1px solid #c7cbcf;
                border-radius: 6px;
                font-size: 20px;
              "
              oninput="captureInput(event)"
            ></textarea>
            <span
              id="first-swapper"
              style="
                background-color: white;
                display: flex;
                flex-direction: column-reverse;
                border: 1px solid #c7cbcf;
                font-size: 20px;
                border-radius: 4px;
                width: 20px;
              "
              >10</span
            >
          </div>

          <div id="functionButtons" style="padding: 5px">
            <button class="handleButtons"
              style="
                border: none;
                border-radius: 6px;
                color: white;
                background-color: #28a745;
                padding: 10px;
                cursor: pointer;
              "
              onmouseover="this.style.background='deepskyblue';"
              onmouseout="this.style.background='#28a745';"
              onclick="convert()"
            >
              Convert
            </button>
            <button class="handleButtons"
              style="
                border: none;
                border-radius: 6px;
                color: white;
                background-color: #6c757d;
                padding: 10px;
                cursor: pointer;
              "
              onmouseover="this.style.background='#5a6268';"
              onmouseout="this.style.background='#6c757d';"
              onclick="reset()"
            >
              Reset
            </button>
            <button class="handleButtons"
              style="
                border: none;
                border-radius: 6px;
                color: white;
                background-color: #6c757d;
                padding: 10px;
                cursor: pointer;
              "
              onmouseover="this.style.background='#5a6268';"
              onmouseout="this.style.background='#6c757d';"
              onclick="swap()"
            >
              Swap
            </button>
          </div>
          <div>Rezultatul in baza <span id="base-result">2</span></div>
          <div style="display: flex; flex-direction: row">
            <div
              id="rezultat"
              style="
                width: 98%;
                height: 60px;
                background-color: white;
                border: 1px solid #c7cbcf;
                border-radius: 6px;
                color: black;
                font-size: 20px;

                word-break: break-all;
                white-space: normal;
                overflow-wrap: break-word;
                overflow-y: auto;
              "
            ></div>
            <span
              id="secound-swapper"
              style="
                background-color: white;
                display: flex;
                flex-direction: column-reverse;
                border: 1px solid #c7cbcf;
                font-size: 20px;
                border-radius: 4px;
                width: 20px;
              "
              >2</span
            >
          </div>
        </div>
      </div>
    </div>

    <script>
      let n;
      let rezultat = 0n;
      let putere = 1n;

      const convert = () => {
        const key = document.getElementById("in").value;
        const operationResult = document.getElementById("rezultat");

        if (n.startsWith("-")) {
          alert("Numarul trebuie sa fie pozitiv");
          return;
        }

        n = BigInt(n);
        let rezultat = 0n;
        let putere = 1n;

        switch (key) {
          case "binar":
            rezultat = 0n;
            putere = 1n;
            while (n > 0n) {
              cat = n % 2n;
              rezultat = rezultat + cat * putere;
              putere = putere * 10n;
              n = n / 2n;
            }
            operationResult.innerHTML = rezultat.toString();
            break;

          case "zecimal":
            rezultat = 0n;
            putere = 1n;
            while (n > 0n) {
              cat = n % 10n;
              rezultat = rezultat + putere * cat;
              putere = putere * 2n;
              n = n / 10n;
            }
            operationResult.innerHTML = rezultat.toString();
            break;

          case "octal":
            rezultat = 0n;
            putere = 1n;
            while (n > 0n) {
              cat = n % 8n;
              rezultat = rezultat + putere * cat;
              putere = putere * 10n;
              n = n / 8n;
            }
            operationResult.innerHTML = rezultat.toString();
            break;
        }
      };

      const captureInput = (event) => {
        n = event.target.value;
      };

      const reset = () => {
        document.getElementById("rezultat").innerHTML = "";
        document.getElementById("inputText").value = "";
      };

      const swap = () => {
        let selectDin = document.getElementById("din");
        let selectIn = document.getElementById("in");

        let temp = selectDin.value;
        selectDin.value = selectIn.value;
        selectIn.value = temp;

        if (selectIn.value === "binar") {
          document.getElementById("first-swapper").innerHTML = "10";
          document.getElementById("secound-swapper").innerHTML = "2";
          document.getElementById("conversion").innerHTML = "zecimala";
          document.getElementById("base-result").innerHTML = "2";
        } else {
          document.getElementById("first-swapper").innerHTML = "2";
          document.getElementById("secound-swapper").innerHTML = "10";
          document.getElementById("conversion").innerHTML = "binara";
          document.getElementById("base-result").innerHTML = "10";
        }
      };
    </script>
    <style>
      @media (max-width: 336px)
      {
        #selectDiv {
          display: flex;
          flex-direction: column;
        }

      }
      @media (max-width: 480px) {
        #centerdiv {
          width: 50%;
        }

        #din {
          width: 50px;
          font-size: 8px !important;
          padding: 5px 0px !important;
        }

        #in {
          width: 50px;
          font-size: 8px !important;
          padding: 5px 0px !important;
        }

        select option {
          font-size: 6px;
        }
        #functionButtons {
          display: flex;
          flex-direction: column;
        }
      }

      @media (min-width: 481px) and (max-width: 768px) {
         #din {
          width: fit-content;
          font-size: 12px !important;
          padding: 5px 0px !important;
        }

        #in {
          width: fit-content;
          font-size: 12px !important;
          padding: 5px 0px !important;
        }
        .handleButtons {
          font-size: 6px;
        }
        
      }

      @media (min-width: 769px) and (max-width: 1000px) {
         #din {
          width: fit-content;
          font-size: 14px !important;
          padding: 5px 0px !important;
        }

        #in {
          width: fit-content;
          font-size: 14px !important;
          padding: 5px 0px !important;
        }
      }
    </style>
  </body>
</html>
